name: DiskSweeper
options:
  bundleIdPrefix: com.ylnaos
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  DiskSweeper:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ylnaos.DiskSweeper
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "磁盘清道夫"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
schemes:
  DiskSweeper:
    build:
      targets:
        DiskSweeper: all
    run:
      config: Debug
